name: Checks

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]"

      - name: Run Ruff
        run: |
          ruff format --check .
          ruff check .

      - name: Run tests
        run: pytest -q

      - name: Run CLI smoke experiment
        run: python -m pytorch_foundations.cli --epochs 2 --seed 7 --output /tmp/pytorch-foundations-smoke.json
